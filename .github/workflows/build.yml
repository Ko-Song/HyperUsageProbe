name: Build APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/build.yml"

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hyper-usage-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate project structure
        shell: bash
        run: |
          set -e

          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/xposed_init
          test -f app/src/main/res/values/arrays.xml

          test -f \
            app/src/main/java/io/github/kosong/hyperusageprobe/XposedEntry.java

          test -f \
            app/src/main/java/io/github/kosong/hyperusageprobe/hook/MiSettingsProbe.java

          grep -Fx \
            "io.github.kosong.hyperusageprobe.XposedEntry" \
            app/src/main/assets/xposed_init

          grep -F \
            'android:name="xposedminversion"' \
            app/src/main/AndroidManifest.xml

          grep -F \
            'android:name="xposedscope"' \
            app/src/main/AndroidManifest.xml

          grep -F \
            "com.xiaomi.misettings" \
            app/src/main/res/values/arrays.xml

          echo "Project structure validation passed."

      - name: Build debug APK
        shell: bash
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Build unsigned release APK
        shell: bash
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease

      - name: Show output files
        if: always()
        shell: bash
        run: |
          find app/build/outputs \
            -maxdepth 8 \
            -type f \
            -print 2>/dev/null || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperUsageProbe-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperUsageProbe-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
          retention-days: 30